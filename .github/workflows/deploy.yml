name: Deploy to DigitalOcean

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 165.22.16.160
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            /opt/apps/chess-analysis-api-deploy.sh
